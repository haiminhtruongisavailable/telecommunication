// Two dies, one hop. BookSim default pick = FCFS/round-robin.
// EDF (min D_k) stays in golden/hop.py. Do not patch BookSim for EDF.

topology = mesh;
k = 2;
n = 1;
routing_function = dor;

num_vcs     = 1;
vc_buf_size = 16;
wait_for_tail_credit = 1;

vc_allocator = islip;
sw_allocator = islip;
alloc_iters  = 1;

credit_delay   = 4;
routing_delay  = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;

traffic = neighbor;
packet_size = 16;
use_read_write = 0;

sim_type = latency;
injection_rate = 0.04;
warmup_periods = 1;
sample_period = 2000;
sim_count = 1;
print_csv_results = 1;
